[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geomechanics-toolbox"
version = "2.0.0a0"
description = "Geomechanics Toolbox - Python port of the MATLAB rock-mechanics toolbox (borehole stability, hydrofracturing, hydroshearing, temperature, stereonet, Mohr circle)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "PySide6>=6.6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
geomech = "geomech.gui.app:main"

[tool.setuptools.packages.find]
include = ["geomech*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# src/ holds the MATLAB sources, not a Python src-layout: point type checkers at the repo root.
[tool.ty.environment]
root = ["."]

[tool.pyright]
include = ["geomech", "tests", "tools"]
extraPaths = ["."]
